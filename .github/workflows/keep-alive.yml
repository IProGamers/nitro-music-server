name: keep-spaces-awake

# Hugging Face free Spaces sleep after ~48h of inactivity. This pings both
# Spaces every 30 minutes so the idle timer never trips and they stay warm.
# Runs on GitHub's schedule (and can be triggered manually from the Actions tab).
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping nitrobackend (YouTube / JioSaavn API)
        run: curl -sS -m 40 -o /dev/null -w "backend -> %{http_code}\n" https://iprogamers-nitrobackend.hf.space/ || true
      - name: Ping nitrosocket (Listen Together)
        run: curl -sS -m 40 -o /dev/null -w "socket -> %{http_code}\n" https://iprogamers-nitrosocket.hf.space/health || true
